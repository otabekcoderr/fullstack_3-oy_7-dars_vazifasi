<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM-Dashboard-Customers-List</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="menu-wrapper">
        <div class="dashboard-wrapper">
          <img
            src="./image/setting 1.svg"
            alt="dashboard img"
            class="dashboard-img"
          />
          <h1 class="menu-title">
            Dashboard <span class="versiya">v.01</span>
          </h1>
        </div>
        <div class="menu-item"></div>
        <div class="subs_profile">
          <div class="subscription">
            <p class="sub-text">Upgrade to PRO to get access all Features!</p>
            <button class="sub-btn">Get Pro Now!</button>
          </div>
          <div class="profile">
            <div class="profile-title">
              <div class="profile-img">
                <img src="./image/Ellipse 8.png" alt="profile img" />
              </div>
              <div class="profile-name">
                <p class="user-name">Evano</p>
                <p class="user-role">Project Manager</p>
              </div>
            </div>
            <div class="chevron-down">
              <img
                class="chevron-down-svg"
                src="./image/chevron-down 2.svg"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
      <div class="content-wrapper">
        <div class="great-search-block">
          <div class="great">
            <h2>Hello Evano 👋,</h2>
          </div>
          <div class="search">
            <img src="./image/search 1.svg" alt="search" />
            <input class="search-input" type="search" placeholder="Search"/>
          </div>
        </div>

        <div class="stats-wrapper">
          <!-- Total customers -->
          <div class="stats-title">
            <div class="stats-img">
              <img src="./image/profile-2user.svg" alt="profile 2user" />
            </div>
            <div class="stats-texts">
              <p class="stats-name">Total customers</p>
              <h3 class="stats-num">5,423</h3>
              <div class="stats-grow">
                <div>
                  <img src="./image/green up.svg" alt="up" />
                </div>
                <div class="grow-info">
                  <p class="stats-grow-text"><span>16% </span>this month</p>
                </div>
              </div>
            </div>
          </div>
          <div class="line">
            <img src="./image/Line 2.svg" alt="line" />
          </div>
          <!-- Members -->
          <div class="stats-title">
            <div class="stats-img">
              <img src="./image/profile-tick.svg" alt="members" />
            </div>
            <div class="stats-texts">
              <p class="stats-name">Members</p>
              <h3 class="stats-num">1,893</h3>
              <div class="stats-grow">
                <img src="./image/arrow-up 1.svg" alt="up" />
                <p class="stats-grow-text"><span>1% </span>this month</p>
              </div>
            </div>
          </div>

          <div class="line">
            <img src="./image/Line 2.svg" alt="line" />
          </div>
          <!-- Actiwe now -->
          <div class="stats-title">
            <div class="stats-img">
              <img src="./image/monitor.svg" alt="actiwe now" />
            </div>
            <div class="stats-texts">
              <p class="stats-name">Actiwe now</p>
              <h3 class="stats-num">189</h3>
              <div class="stats-grow">
                <div class="avatars">
                  <img
                    class="avatar"
                    src="./image/Ellipse 58.png"
                    alt="User 1"
                  />
                  <img
                    class="avatar"
                    src="./image/Ellipse 59.png"
                    alt="User 2"
                  />
                  <img
                    class="avatar"
                    src="./image/Ellipse 60.png"
                    alt="User 3"
                  />
                  <img
                    class="avatar"
                    src="./image/Ellipse 61.png"
                    alt="User 4"
                  />
                  <img
                    class="avatar"
                    src="./image/Ellipse 62.png"
                    alt="User 5"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
